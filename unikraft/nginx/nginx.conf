worker_processes 1;
master_process off;
daemon off;
user root root;

error_log stderr error;
pid /tmp/nginx.pid;

events {
    worker_connections 10240;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    server_tokens off;
    client_max_body_size 64k;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_types text/plain application/json "application/xml; charset=utf-8" "application/json; charset=utf-8";

    keepalive_timeout 20s;

    # TLS ends at the Unikraft Cloud proxy, so nginx only sees plain HTTP on
    # port 8080. Absolute redirects (such as the trailing-slash redirect from
    # /ext to /ext/ that Helium relies on) would point to http://<host>:8080.
    absolute_redirect off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The rootfs overlay lives in instance RAM, so buffering large CRX
    # downloads to a temp file would eat into the instance's memory.
    proxy_max_temp_file_size 0;

    # Unikraft Cloud terminates TLS and forwards plain HTTP to this port.
    server {
        listen 8080 default_server;
        server_name _;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Alt-Svc clear always;

        location = / {
            return 302 https://helium.computer;
        }

        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /bangs.json {
            add_header Cache-Control "public, max-age=86400, stale-if-error=604800";
            add_header Access-Control-Allow-Origin *;
            root /srv/bangs;
        }

        location = /connectivitycheck {
            return 204;
        }

        location /dict {
            gzip_static always;
            root /srv/dictionaries;

            autoindex on;
            sub_filter ".gz" "";
            sub_filter_once off;
        }

        location = /ext/proxy {
            proxy_pass http://helium-ext.internal:8000/proxy;
        }

        location /ext/ {
            proxy_pass http://helium-ext.internal:8000/;
        }

        location /com {
            proxy_pass http://helium-ext.internal:8000/com;
        }

        location /ubo/ {
            proxy_pass http://helium-ubo.internal:8000/;
            proxy_pass_request_body off;
        }
    }
}
